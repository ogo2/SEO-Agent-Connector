[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsemodeli-seo-agent-connector"
version = "1.1.1"
description = "Simple installable SEO Agent Publishing API v1 connector for Flask sites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=2.3"]

[tool.setuptools.packages.find]
where = ["."]
